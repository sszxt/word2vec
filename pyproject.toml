[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "word2vec-repro"
version = "0.1.0"
description = "Reproduction of Mikolov et al. 2013, 'Efficient Estimation of Word Representations in Vector Space'"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "tqdm>=4.66",
    "requests>=2.31",
]

[project.optional-dependencies]
reference = ["gensim>=4.3"]

[tool.setuptools.packages.find]
where = ["src"]
